<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双语文档对照阅读器</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">📖 双语文档中心</div>
  <select id="docSelect" title="选择文档"></select>
  <span class="lang-pair">中文 ⇄ English</span>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="搜索全部版本（含历史）…">
    <div id="searchResults" class="search-results hidden"></div>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<div id="toolbar">
  <label>原文版本 <select id="srcVersionSelect"></select></label>
  <label>译文版本 <select id="tgtVersionSelect"></select></label>
  <button id="latestBtn" title="回到最新版本">最新版本</button>
  <span class="spacer"></span>
  <button id="graphBtn" class="toggle">段落对齐图</button>
  <button id="lockBtn" title="整篇语言锁：仅当全部译段已验证时可锁定">锁定整篇</button>
</div>

<main id="reader">
  <section id="leftPane" class="pane" aria-label="原文"></section>
  <div class="divider"></div>
  <section id="rightPane" class="pane" aria-label="译文"></section>
</main>

<aside id="graphPanel" class="hidden">
  <h3>整篇语言锁 vs 段落级对齐图</h3>
  <div id="syncReport"></div>
  <h3>对齐明细（语义节点，非数组下标）</h3>
  <div id="alignGraph"></div>
</aside>

<div id="modal" class="hidden">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="primary">确定</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
